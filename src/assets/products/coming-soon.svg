<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid slice">
  <!-- Soft gradient background matching site's secondary color -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f4"/>
      <stop offset="100%" stop-color="#ebebea"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- Minimal cart silhouette icon -->
  <g transform="translate(600, 480)" stroke="#a8a8a6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <!-- canopy -->
    <path d="M -150 -100 L 0 -180 L 150 -100 Z"/>
    <!-- posts -->
    <line x1="-130" y1="-100" x2="-130" y2="40"/>
    <line x1="130" y1="-100" x2="130" y2="40"/>
    <!-- top -->
    <line x1="-150" y1="40" x2="150" y2="40"/>
    <!-- body -->
    <rect x="-140" y="40" width="280" height="120"/>
    <!-- wheels -->
    <circle cx="-90" cy="180" r="20"/>
    <circle cx="90" cy="180" r="20"/>
  </g>

  <!-- Text -->
  <text x="600" y="780" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="46" font-weight="300" fill="#525252"
        letter-spacing="8">
    COMING SOON
  </text>
  <text x="600" y="830" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="22" font-weight="300" fill="#a8a8a6"
        letter-spacing="6">
    YAKINDA
  </text>

  <!-- Divider -->
  <line x1="540" y1="870" x2="660" y2="870" stroke="#a8a8a6" stroke-width="1"/>

  <!-- Brand mark (very subtle) -->
  <text x="600" y="920" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif"
        font-size="14" font-weight="400" fill="#c4c4c2"
        letter-spacing="4">
    RUMICARTS
  </text>
</svg>
